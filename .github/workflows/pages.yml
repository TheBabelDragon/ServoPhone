name: Deploy GitHub Pages

# Deploys the static frontend from this branch.
# Repository Settings → Pages → Source should be "GitHub Actions"
# if not already configured. This workflow does not overwrite
# existing Pages source settings in the UI; it only provides the action.

on:
  push:
    branches:
      - feat/touchscreen-servo-controller
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Root of the static site (index.html + assets/)
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
